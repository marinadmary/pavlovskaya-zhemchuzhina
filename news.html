<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архив новостей — ТСН «Павловская Жемчужина»</title>
  <meta name="description" content="Архив новостей, собраний и важных объявлений ТСН «Павловская Жемчужина».">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header archive-header">
    <div class="container header-row">
      <a class="brand" href="index.html" aria-label="На главную">
        <img src="assets/logo-full.png" alt="ТСН Павловская Жемчужина">
      </a>
      <nav class="main-nav archive-nav">
        <a href="index.html">На главную</a>
        <a href="index.html#news">Последние новости</a>
        <a href="index.html#documents">Документы</a>
        <a href="index.html#contacts">Контакты</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="archive-hero">
      <div class="container">
        <p class="eyebrow blue">Новости ТСН</p>
        <h1>Архив новостей</h1>
        <p class="archive-lead">Новости, важные объявления, голосования и итоги собраний — от новых к более ранним.</p>
        <div class="archive-filters" aria-label="Фильтры архива">
          <button class="archive-filter active" type="button" data-filter="all">Все</button>
          <button class="archive-filter" type="button" data-filter="meeting">Собрания</button>
          <button class="archive-filter" type="button" data-filter="vote">Голосования</button>
          <button class="archive-filter" type="button" data-filter="news">Новости</button>
        </div>
      </div>
    </section>

    <section class="section archive-section">
      <div class="container archive-list" id="archiveList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>ТСН «Павловская Жемчужина»</span>
      <a href="index.html">Вернуться на главную</a>
    </div>
  </footer>


  <div class="archive-lightbox" id="archiveLightbox" hidden role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
    <div class="archive-lightbox-backdrop"></div>
    <div class="archive-lightbox-dialog">
      <button class="archive-lightbox-close" type="button" aria-label="Закрыть фотографию">×</button>
      <img class="archive-lightbox-image" src="" alt="">
    </div>
  </div>

  <script src="news-data.js"></script>
  <script src="news-archive.js"></script>
</body>
</html>
